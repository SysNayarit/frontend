<div class="overflow-x-auto bg-white rounded-lg shadow">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre Completo</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CURP</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email Personal</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teléfono</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let item of personas">
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
          {{ item.num_expediente }} {{ item.apellido_paterno || '' }} {{ item.apellido_materno }} {{ item.nombres || '' }}
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ item.curp || 'N/A' }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ item.correo_institucional || 'N/A' }}</td>
        
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
          <button class="text-blue-600 hover:text-blue-900">Ver</button>
          <button class="text-indigo-600 hover:text-indigo-900">Editar</button>
        </td>
      </tr>
      <tr *ngIf="personas.length === 0">
        <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">
          No hay registros de personas disponibles.
        </td>
      </tr>
    </tbody>
  </table>
</div>
