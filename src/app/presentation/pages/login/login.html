<div class="min-h-screen flex items-center justify-center bg-background p-4 font-sans">
  <div class="bg-surface p-8 sm:p-10 rounded-xl shadow-2xl w-full max-w-md border-t-8 border-primary">
    
    <!-- Identidad Visual -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-accent rounded-full mx-auto mb-4 opacity-90 flex items-center justify-center shadow-inner">
        <span class="text-white font-bold text-xl">S</span>
      </div>
      <h2 class="text-3xl font-bold text-secondary uppercase tracking-widest">SIGA</h2>
      <p class="text-sm text-gray-500 mt-2 font-medium">Sistema Integral de Gestión Académica</p>
    </div>

    <!-- Formulario -->
    <form class="space-y-6">
      <div>
        <label class="block text-sm font-bold text-secondary mb-2">Correo Electrónico</label>
        <input type="email" 
               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-gray-700" 
               placeholder="usuario@institucion.gob.mx">
      </div>

      <div>
        <label class="block text-sm font-bold text-secondary mb-2">Contraseña</label>
        <input type="password" 
               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-gray-700" 
               placeholder="••••••••">
      </div>

      <button type="button" 
              class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg mt-4">
        Ingresar al Sistema
      </button>
    </form>

  </div>
</div>
